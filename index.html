    <script>
        let inventario = [];
        let timerSilencioso = null;

        function limpiarNombre(texto) {
            if (!texto) return '';
            let limpio = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            const basura = ['lata de ', 'frasco de ', 'bolsa de ', 'paquete de ', 'caja de ', 'botella de ', 'kg de '];
            basura.forEach(p => { limpio = limpio.replace(p, ''); });
            return limpio.replace(/\s+/g, ' ').trim();
        }

        function calcularSimilitud(s1, s2) {
            let longer = s1; let shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            if (longer.length === 0) return 1.0;
            return (longer.length - editarDistancia(longer, shorter)) / parseFloat(longer.length);
        }

        function editarDistancia(s1, s2) {
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue; lastValue = newValue;
                    }
                }
                if (s1.length > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function buscarProductoSimilar(nombreNuevo) {
            let nombreLimpio = limpiarNombre(nombreNuevo);
            if (!nombreLimpio) return null;
            let mejorCandidato = null;
            let maxSimilitud = 0;

            for (let item of inventario) {
                let itemLimpio = limpiarNombre(item.nombre);
                if (itemLimpio === nombreLimpio) return item;
                if (itemLimpio.includes(nombreLimpio) || nombreLimpio.includes(itemLimpio)) return item; 
                let similitud = calcularSimilitud(itemLimpio, nombreLimpio);
                if (similitud > maxSimilitud) { maxSimilitud = similitud; mejorCandidato = item; }
            }
            if (maxSimilitud >= 0.75) return mejorCandidato;
            return null;
        }

        async function cargarDesdeNube() {
            mostrarLoading(true, "Descargando inventario...");
            try {
                const response = await fetch(URL_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, accion: 'leer' }) });
                const data = await response.json();
                if(data.inventario) {
                    inventario = data.inventario.map(i => {
                        let u = String(i.unidad || '').toLowerCase().trim();
                        let m = parseFloat(i.minimo);
                        if (!isNaN(u) && u !== '') { m = parseFloat(u); u = 'unid'; } 
                        else if (!['unid', 'kg', 'gs', 'g'].includes(u)) { u = 'unid'; }
                        if (isNaN(m)) m = 0;
                        return { id: Number(i.id) || Date.now() + Math.random(), nombre: i.nombre || '', categoria: i.categoria || 'Otros', cantidad: parseFloat(i.cantidad) || 0, unidad: u, minimo: m };
                    });
                    renderizar();
                } else if(data.error) throw new Error(data.error);
            } catch(e) {
                console.error("Error al cargar:", e);
                inventario = JSON.parse(localStorage.getItem('hogar_stock')) || []; renderizar();
            } finally { mostrarLoading(false); }
        }

        async function guardarDatosSilencioso() {
            localStorage.setItem('hogar_stock', JSON.stringify(inventario));
            try { await fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify({ token: TOKEN, accion: 'guardar', inventario: inventario }) }); } catch(e) {}
        }

        async function guardarDatosConLoader() {
            localStorage.setItem('hogar_stock', JSON.stringify(inventario));
            renderizar();
            mostrarLoading(true, "Guardando...");
            try { await fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify({ token: TOKEN, accion: 'guardar', inventario: inventario }) }); } catch(e) {} 
            finally { mostrarLoading(false); }
        }

        function enviarAHistorialBackground(nombre, categoria, cantidad, unidad) {
            fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify({ token: TOKEN, accion: 'historial', compra: { nombre, categoria, cantidad, unidad } }) }).catch(e => {});
        }

        function cambiarTab(tab) {
            document.getElementById('sec-stock').style.display = tab === 'stock' ? 'block' : 'none';
            document.getElementById('sec-lista').style.display = tab === 'lista' ? 'block' : 'none';
            document.getElementById('tab-stock').className = tab === 'stock' ? 'flex-1 py-3.5 text-center tab-active bg-white' : 'flex-1 py-3.5 text-center tab-inactive bg-gray-50 border-b border-gray-200';
            document.getElementById('tab-lista').className = tab === 'lista' ? 'flex-1 py-3.5 text-center tab-active bg-white' : 'flex-1 py-3.5 text-center tab-inactive bg-gray-50 border-b border-gray-200';
        }

        function toggleBuscador() {
            const buscador = document.getElementById('contenedor-buscador');
            buscador.classList.toggle('hidden');
            if (!buscador.classList.contains('hidden')) document.getElementById('input-buscador').focus();
            else { document.getElementById('input-buscador').value = ''; renderizar(); }
        }

        function toggleFiltro(estado) {
            filtroActual = (filtroActual === estado) ? 'todos' : estado;
            renderizar();
        }

        function toggleCategoria(cat) {
            estadoCategorias[cat] = !estadoCategorias[cat];
            renderizar();
        }

        function agregarProductoManual(e) {
            e.preventDefault();
            let nombre = document.getElementById('nombre-stock').value.trim();
            let categoria = document.getElementById('categoria-stock').value;
            let cantidad = parseFloat(document.getElementById('cant-stock').value) || 0;
            let unidad = document.getElementById('unidad-stock').value;
            let minimo = parseFloat(document.getElementById('min-stock').value) || 0;
            let vaAHistorial = document.getElementById('historial-stock').checked;
            
            let existente = buscarProductoSimilar(nombre);

            if (existente) {
                let confirmar = confirm(`🔍 Producto similar detectado: "${existente.nombre}".\n¿Deseas sumar ${cantidad} a este producto?`);
                if (confirmar) {
                    existente.cantidad += cantidad; existente.categoria = categoria; existente.unidad = unidad; existente.minimo = minimo;
                    if(vaAHistorial && cantidad > 0) enviarAHistorialBackground(existente.nombre, categoria, cantidad, unidad);
                } else {
                    inventario.push({ id: Date.now(), nombre, categoria, cantidad, unidad, minimo });
                    if(vaAHistorial && cantidad > 0) enviarAHistorialBackground(nombre, categoria, cantidad, unidad);
                }
            } else {
                inventario.push({ id: Date.now(), nombre, categoria, cantidad, unidad, minimo });
                if(vaAHistorial && cantidad > 0) enviarAHistorialBackground(nombre, categoria, cantidad, unidad);
            }

            document.getElementById('form-add-stock').reset();
            document.getElementById('cant-stock').value = 1;
            document.getElementById('min-stock').value = 1;
            document.getElementById('contenedor-form-stock').classList.add('hidden');
            guardarDatosConLoader();
        }

        function agregarCompraManual(e) {
            e.preventDefault();
            let nombre = document.getElementById('nombre-compra').value.trim();
            let existente = buscarProductoSimilar(nombre);

            if (existente) {
                let confirmar = confirm(`🔍 Producto detectado: "${existente.nombre}".\n¿Deseas pasarlo a faltante (stock 0)?`);
                if (confirmar) existente.cantidad = 0;
                else inventario.push({ id: Date.now(), nombre, categoria: "Otros", cantidad: 0, unidad: "unid", minimo: 1 });
            } else {
                inventario.push({ id: Date.now(), nombre, categoria: "Otros", cantidad: 0, unidad: "unid", minimo: 1 });
            }

            document.getElementById('form-add-compra').reset();
            document.getElementById('contenedor-form-compra').classList.add('hidden');
            guardarDatosConLoader();
        }

        function modificarStockUI(id, monto) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (item) { 
                item.cantidad = Math.max(0, parseFloat((item.cantidad + monto).toFixed(2))); 
                renderizar(); 
                clearTimeout(timerSilencioso);
                timerSilencioso = setTimeout(() => { guardarDatosSilencioso(); }, 1500);
            }
        }

        function setStockManual(id) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (!item) return;
            let nuevo = prompt(`Ingrese nueva cantidad exacta para "${item.nombre}":`, item.cantidad);
            if (nuevo !== null && !isNaN(parseFloat(nuevo))) { 
                item.cantidad = Math.max(0, parseFloat(parseFloat(nuevo).toFixed(2))); 
                renderizar(); 
                guardarDatosSilencioso(); 
            }
        }

        function comprarCantidadCustom(id) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (!item) return;
            let nombreUnidad = item.unidad === 'kg' ? 'kilos' : (item.unidad === 'gs' || item.unidad === 'g' ? 'gramos' : 'unidades');
            let cantidadAgregar = prompt(`¿Cuántos ${nombreUnidad} compraste de "${item.nombre}"?`, "1");
            if (cantidadAgregar === null) return;
            let num = parseFloat(cantidadAgregar);
            if (!isNaN(num) && num > 0) { 
                item.cantidad += num; 
                renderizar(); 
                guardarDatosSilencioso(); 
                enviarAHistorialBackground(item.nombre, item.categoria, num, item.unidad);
            }
        }

        function abrirModal(id) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-nombre').value = item.nombre;
            document.getElementById('edit-categoria').value = item.categoria || 'Almacén';
            document.getElementById('edit-cantidad').value = item.cantidad;
            document.getElementById('edit-unidad').value = item.unidad || 'unid';
            document.getElementById('edit-minimo').value = item.minimo;
            document.getElementById('modal-editar').classList.remove('hidden');
        }
        function cerrarModal() { document.getElementById('modal-editar').classList.add('hidden'); }
        function guardarEdicion() {
            const id = Number(document.getElementById('edit-id').value);
            const item = inventario.find(i => Number(i.id) === id);
            if (item) {
                item.nombre = document.getElementById('edit-nombre').value;
                item.categoria = document.getElementById('edit-categoria').value;
                item.cantidad = parseFloat(document.getElementById('edit-cantidad').value) || 0;
                item.unidad = document.getElementById('edit-unidad').value;
                item.minimo = parseFloat(document.getElementById('edit-minimo').value) || 0;
                guardarDatosConLoader(); cerrarModal();
            }
        }
        function eliminarDesdeModal() {
            const id = Number(document.getElementById('edit-id').value);
            if (confirm("¿Seguro que quieres borrar este producto por completo?")) {
                inventario = inventario.filter(i => Number(i.id) !== id);
                guardarDatosConLoader(); cerrarModal();
            }
        }

        function abrirModalTexto() { document.getElementById('texto-masivo').value = ''; document.getElementById('modal-texto').classList.remove('hidden'); }
        function cerrarModalTexto() { document.getElementById('modal-texto').classList.add('hidden'); }
        function mostrarLoading(estado, texto = "Procesando...") {
            document.getElementById('loading-text').innerText = texto;
            if (estado) document.getElementById('modal-loading').classList.remove('hidden');
            else document.getElementById('modal-loading').classList.add('hidden');
        }

        function procesarImagenIA(input) {
            const file = input.files[0];
            if (!file) return;
            mostrarLoading(true, "Comprimiendo foto...");
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } }
                    else { if (height > 800) { width *= 800 / height; height = 800; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const base64Data = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    llamarGemini('imagen', base64Data);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file); input.value = '';
        }

        function procesarTextoIA() {
            const texto = document.getElementById('texto-masivo').value.trim();
            if (!texto) return alert("Escribe algo primero.");
            cerrarModalTexto(); llamarGemini('texto', texto);
        }

        async function llamarGemini(tipo, contenido) {
            mostrarLoading(true, "IA Analizando...");
            try {
                const response = await fetch(URL_APPS_SCRIPT, { method: 'POST', body: JSON.stringify({ token: TOKEN, accion: tipo === 'imagen' ? 'gemini_imagen' : 'gemini_texto', contenido: contenido }) });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                let productos = data.resultado;
                if (!Array.isArray(productos)) productos = productos[Object.keys(productos)[0]];
                mostrarPanelVerificacion(productos);
            } catch (error) { alert("Error de IA: " + error.message); } finally { mostrarLoading(false); }
        }

        let itemsTemporales = [];
        function mostrarPanelVerificacion(productos) {
            document.getElementById('toggle-historial-ia').checked = false;
            itemsTemporales = productos.map((p, index) => ({ id_temp: 'temp_'+index, nombre: p.nombre || 'Desconocido', categoria: p.categoria || 'Otros', cantidad: parseFloat(p.cantidad) || 1, unidad: p.unidad || 'unid', minimo: 1 }));
            dibujarListaVerificacion(); document.getElementById('modal-verificacion').classList.remove('hidden');
        }

        function dibujarListaVerificacion() {
            const container = document.getElementById('lista-verificacion');
            container.innerHTML = '';
            itemsTemporales.forEach((item, index) => {
                let existente = buscarProductoSimilar(item.nombre);
                let controlDuplicado = existente 
                    ? `<label class="flex items-center gap-2 bg-blue-50 text-blue-900 text-xs font-bold px-2.5 py-2 rounded-lg shadow-sm cursor-pointer mt-2 border border-blue-200 transition active:bg-blue-100">
                        <input type="checkbox" checked onchange="itemsTemporales[${index}].forzarNuevo = !this.checked" class="w-4 h-4 text-blue-600 rounded">
                        🔄 Fusionar stock con: "${existente.nombre}"
                       </label>`
                    : `<span class="bg-green-50 text-green-800 text-xs font-bold px-2.5 py-2 rounded-lg shadow-sm mt-2 inline-block border border-green-200">✨ Producto Nuevo</span>`;

                let opcionesCategoria = Object.keys(iconosCat).map(cat => 
                    `<option value="${cat}" ${item.categoria === cat ? 'selected' : ''}>${cat}</option>`
                ).join('');

                container.innerHTML += `
                    <div class="bg-white p-3 border border-gray-100 rounded-xl flex flex-col gap-1 relative pb-3 shadow-sm mb-2">
                        <button onclick="eliminarItemTemporal(${index})" class="absolute top-2 right-2 text-red-500 bg-red-50 rounded-lg w-7 h-7 flex items-center justify-center font-bold hover:bg-red-100">X</button>
                        <div class="pr-8">
                            <label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Producto</label>
                            <input type="text" class="w-full border-b border-gray-200 text-sm py-1 font-bold text-gray-900 bg-transparent focus:border-blue-500 focus:outline-none" value="${item.nombre}" onchange="itemsTemporales[${index}].nombre=this.value">
                            ${controlDuplicado}
                        </div>
                        <div class="flex gap-2 items-end mt-2">
                            <div class="flex-1">
                                <label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Cat.</label>
                                <select class="w-full border-b border-gray-300 text-xs py-1.5 bg-gray-50 rounded text-gray-700 font-bold focus:border-blue-500 focus:outline-none px-1" onchange="itemsTemporales[${index}].categoria=this.value">
                                    ${opcionesCategoria}
                                </select>
                            </div>
                            <div class="w-14">
                                <label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Cant.</label>
                                <input type="number" step="any" class="w-full border-b border-gray-400 text-sm py-1 text-center bg-gray-50 rounded font-black text-blue-600 focus:border-blue-500 focus:outline-none" value="${item.cantidad}" onchange="itemsTemporales[${index}].cantidad=parseFloat(this.value)||0">
                            </div>
                            <div class="w-16">
                                <label class="text-[10px] text-gray-400 font-bold uppercase ml-1">U.</label>
                                <select class="w-full border-b border-gray-300 text-xs py-1.5 text-center bg-gray-50 rounded text-gray-700 font-bold focus:border-blue-500 focus:outline-none px-1" onchange="itemsTemporales[${index}].unidad=this.value">
                                    <option value="unid" ${item.unidad === 'unid' || !['kg','gs','g'].includes(item.unidad) ? 'selected' : ''}>unid</option>
                                    <option value="kg" ${item.unidad === 'kg' ? 'selected' : ''}>kg</option>
                                    <option value="gs" ${(item.unidad === 'gs' || item.unidad === 'g') ? 'selected' : ''}>gs</option>
                                </select>
                            </div>
                            <div class="w-12">
                                <label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Mín.</label>
                                <input type="number" step="any" class="w-full border-b border-gray-300 text-sm py-1 text-center bg-gray-50 rounded text-gray-700 font-bold focus:border-blue-500 focus:outline-none" value="${item.minimo}" onchange="itemsTemporales[${index}].minimo=parseFloat(this.value)||0">
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function eliminarItemTemporal(index) { itemsTemporales.splice(index, 1); dibujarListaVerificacion(); }
        function cerrarModalVerificacion() { itemsTemporales = []; document.getElementById('modal-verificacion').classList.add('hidden'); }
        
        function guardarVerificados() {
            const vaAHistorial = document.getElementById('toggle-historial-ia').checked;
            itemsTemporales.forEach(item => {
                if(item.nombre.trim() !== '') {
                    let existente = item.forzarNuevo ? null : buscarProductoSimilar(item.nombre);
                    if (existente) {
                        existente.cantidad += item.cantidad;
                        if(vaAHistorial && item.cantidad > 0) enviarAHistorialBackground(existente.nombre, existente.categoria, item.cantidad, existente.unidad);
                    } else {
                        inventario.push({ id: Date.now() + Math.random(), nombre: item.nombre, categoria: item.categoria, cantidad: item.cantidad, unidad: item.unidad || 'unid', minimo: item.minimo });
                        if(vaAHistorial && item.cantidad > 0) enviarAHistorialBackground(item.nombre, item.categoria, item.cantidad, item.unidad);
                    }
                }
            });
            guardarDatosConLoader(); cerrarModalVerificacion(); cambiarTab('stock');
        }

        function renderizar() {
            const listaStock = document.getElementById('lista-stock');
            const listaCompras = document.getElementById('lista-compras');
            const termino = document.getElementById('input-buscador') ? document.getElementById('input-buscador').value.toLowerCase() : '';
            
            listaStock.innerHTML = ''; listaCompras.innerHTML = '';
            
            let countOK = 0, countAlerta = 0, countAgotado = 0;
            
            let invFiltrado = inventario.filter(item => { if (termino && !item.nombre.toLowerCase().includes(termino) && !(item.categoria || '').toLowerCase().includes(termino)) return false; return true; });
            const invOrdenado = [...invFiltrado].sort((a, b) => a.nombre.localeCompare(b.nombre));

            document.getElementById('btn-filtro-suficiente').className = filtroActual === 'suficiente' ? "cursor-pointer bg-green-50 rounded-xl p-2 shadow-sm border-2 border-green-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";
            document.getElementById('btn-filtro-alerta').className = filtroActual === 'alerta' ? "cursor-pointer bg-yellow-50 rounded-xl p-2 shadow-sm border-2 border-yellow-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";
            document.getElementById('btn-filtro-agotado').className = filtroActual === 'agotado' ? "cursor-pointer bg-red-50 rounded-xl p-2 shadow-sm border-2 border-red-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";

            const categoriasUnicas = [...new Set(invOrdenado.map(i => i.categoria || 'Otros'))].sort();

            categoriasUnicas.forEach(cat => {
                let itemsCat = invOrdenado.filter(i => (i.categoria || 'Otros') === cat);
                
                itemsCat.forEach(item => {
                    if (item.cantidad <= item.minimo) countAgotado++;
                    else if (item.cantidad > item.minimo && item.cantidad <= (item.minimo + 1)) countAlerta++;
                    else countOK++;
                });

                if (filtroActual === 'suficiente') itemsCat = itemsCat.filter(i => i.cantidad > (i.minimo + 1));
                if (filtroActual === 'alerta') itemsCat = itemsCat.filter(i => i.cantidad > i.minimo && i.cantidad <= (i.minimo + 1));
                if (filtroActual === 'agotado') itemsCat = itemsCat.filter(i => i.cantidad <= i.minimo);

                if (itemsCat.length === 0) return;

                const emoji = iconosCat[cat] || "📦";
                
                // INTELIGENCIA VISUAL: Abierto si se hizo click, si se busca texto, o si se usa filtro
                const estaAbierto = !!estadoCategorias[cat] || termino !== '' || filtroActual !== 'todos'; 
                const flecha = estaAbierto ? '▼' : '▶';
                
                listaStock.innerHTML += `
                    <div onclick="toggleCategoria('${cat}')" class="font-extrabold text-gray-700 mt-5 mb-2 flex items-center justify-between text-[15px] border-b-2 border-gray-200 pb-1.5 cursor-pointer select-none active:text-blue-600 transition px-1">
                        <div class="flex items-center gap-2">${emoji} ${cat}</div>
                        <span class="text-xs text-gray-400">${flecha}</span>
                    </div>
                `;

                if (estaAbierto) {
                    itemsCat.forEach(item => {
                        const faltanteTotal = item.cantidad <= item.minimo;
                        const alertaAmarilla = item.cantidad > item.minimo && item.cantidad <= (item.minimo + 1);
                        
                        let borderSide = "bg-gray-300";
                        let bgClass = "bg-white";
                        
                        if (faltanteTotal) { borderSide = "bg-red-500"; bgClass = "bg-red-50"; } 
                        else if (alertaAmarilla) { borderSide = "bg-yellow-400"; bgClass = "bg-yellow-50"; }

                        let stepUp = item.unidad === 'kg' ? 0.5 : (item.unidad === 'gs' || item.unidad === 'g' ? 100 : 1);
                        let stepDown = item.unidad === 'kg' ? -0.5 : (item.unidad === 'gs' || item.unidad === 'g' ? -100 : -1);

                        listaStock.innerHTML += `
                            <div class="flex flex-col p-3.5 rounded-xl shadow-sm mb-3 border border-gray-100 relative overflow-hidden ${bgClass}">
                                <div class="absolute left-0 top-0 bottom-0 w-1.5 ${borderSide}"></div>
                                <div class="pl-2">
                                    <div class="flex justify-between items-start mb-2">
                                        <div class="flex-1 pr-2">
                                            <p class="font-bold text-gray-900 leading-tight text-base">${item.nombre}</p>
                                            <p class="text-xs text-gray-500 mt-0.5 font-semibold">Mínimo: ${item.minimo} ${item.unidad}</p>
                                        </div>
                                        <button onclick="abrirModal(${item.id})" class="text-gray-400 p-1 text-xl hover:text-blue-500 transition">⋮</button>
                                    </div>
                                    <div class="flex justify-end mt-1">
                                        <div class="flex items-center bg-white rounded-full border border-gray-200 shadow-sm p-1">
                                            <button onclick="modificarStockUI(${item.id}, ${stepDown})" class="w-10 h-10 rounded-full text-gray-600 font-bold text-xl flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 transition pb-1">-</button>
                                            <div class="px-3 cursor-pointer min-w-[5rem] text-center" onclick="setStockManual(${item.id})">
                                                <span class="text-base font-black text-gray-800">${item.cantidad}</span>
                                                <span class="text-xs font-bold text-gray-500 block -mt-1">${item.unidad}</span>
                                            </div>
                                            <button onclick="modificarStockUI(${item.id}, ${stepUp})" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-xl flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 shadow-md transition pb-1">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            });

            document.getElementById('dash-ok').innerText = countOK;
            document.getElementById('dash-alerta').innerText = countAlerta;
            document.getElementById('dash-agotado').innerText = countAgotado;

            const faltantes = invOrdenado.filter(item => item.cantidad <= item.minimo);
            
            if (faltantes.length === 0) {
                listaCompras.innerHTML = '<div class="text-center mt-10"><p class="text-4xl mb-3">🎉</p><p class="text-gray-500 font-bold">¡Todo listo! No hay faltantes.</p></div>';
            } else {
                const categoriasFaltantes = [...new Set(faltantes.map(i => i.categoria || 'Otros'))].sort();
                categoriasFaltantes.forEach(cat => {
                    const emoji = iconosCat[cat] || "🛒";
                    listaCompras.innerHTML += `<div class="bg-gray-800 text-white text-xs font-black uppercase tracking-wider px-3 py-2.5 rounded-lg shadow-sm mt-5 mb-3 flex items-center gap-2">${emoji} Pasillo: ${cat}</div>`;
                    
                    const itemsCat = faltantes.filter(i => (i.categoria || 'Otros') === cat);
                    itemsCat.forEach(item => {
                        const enCero = item.cantidad === 0;
                        let etiqueta = enCero ? '<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase tracking-wide">Agotado</span>' : '<span class="bg-yellow-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase tracking-wide">Faltante</span>';
                        
                        listaCompras.innerHTML += `
                            <div class="flex flex-col border border-red-200 p-3.5 rounded-xl shadow-sm bg-red-50 mb-3 relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-red-500"></div>
                                <div class="pl-2">
                                    <div class="flex justify-between items-center mb-3">
                                        <p class="font-bold text-gray-900 text-base leading-tight flex-1">${item.nombre} ${etiqueta}</p>
                                    </div>
                                    <div class="flex justify-between items-center bg-white p-2 rounded-lg border border-gray-200 shadow-sm">
                                        <div>
                                            <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-0.5">En Casa</p>
                                            <p class="text-sm font-black text-gray-800">${item.cantidad} ${item.unidad} <span class="text-gray-400 font-semibold text-xs ml-1">(Mín: ${item.minimo})</span></p>
                                        </div>
                                        <button onclick="comprarCantidadCustom(${item.id})" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md flex items-center gap-1 active:bg-green-700 transition">🛒 Comprar</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                });
            }
        }
        
        window.onload = cargarDesdeNube;
    </script>
</body>
</html>
