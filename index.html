    <script>
        let inventario = [];
        let timerSilencioso = null; // Para el Debouncing

        // 1. Limpieza anti-duplicados 
        function limpiarNombre(texto) {
            if (!texto) return '';
            let limpio = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            const palabrasBasura = ['lata de ', 'frasco de ', 'bolsa de ', 'paquete de ', 'caja de ', 'botella de ', 'kg de '];
            palabrasBasura.forEach(p => { limpio = limpio.replace(p, ''); });
            return limpio.replace(/\s+/g, ' ').trim();
        }

        // 2. Levenshtein estricto (85% para evitar "sal" vs "salsa")
        function calcularSimilitud(s1, s2) {
            let longer = s1; let shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            // Penalizamos fuertemente las diferencias de longitud (Ej: Sal (3) vs Salsa (5))
            if (longerLength - shorter.length > 2) return 0; 
            return (longerLength - editarDistancia(longer, shorter)) / parseFloat(longerLength);
        }

        function editarDistancia(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue; lastValue = newValue;
                        }
                    }
                }
                if (s1.length > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function buscarProductoSimilar(nombreNuevo) {
            let nombreLimpio = limpiarNombre(nombreNuevo);
            if (!nombreLimpio) return null;
            let mejorCandidato = null;
            let maxSimilitud = 0;

            for (let item of inventario) {
                let itemLimpio = limpiarNombre(item.nombre);
                if (itemLimpio === nombreLimpio) return item; // Coincidencia exacta
                
                let similitud = calcularSimilitud(itemLimpio, nombreLimpio);
                if (similitud > maxSimilitud) { maxSimilitud = similitud; mejorCandidato = item; }
            }
            // Umbral estricto del 85%
            if (maxSimilitud >= 0.85) return mejorCandidato;
            return null;
        }

        // --- SISTEMA DE DATOS Y SINCRONIZACIÓN ---
        async function cargarDesdeNube() {
            mostrarLoading(true, "Descargando inventario...");
            try {
                const response = await fetch(URL_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, accion: 'leer' }) });
                const data = await response.json();
                if(data.inventario) {
                    inventario = data.inventario.map(i => ({ id: Number(i.id) || Date.now() + Math.random(), nombre: i.nombre || '', categoria: i.categoria || 'Almacén', cantidad: parseFloat(i.cantidad) || 0, unidad: i.unidad || 'unid', minimo: parseFloat(i.minimo) || 0 }));
                    renderizar();
                } else if(data.error) throw new Error(data.error);
            } catch(e) {
                console.error("Error al cargar la nube:", e);
                inventario = JSON.parse(localStorage.getItem('hogar_stock')) || []; renderizar();
            } finally { mostrarLoading(false); }
        }

        async function guardarDatosSilencioso() {
            localStorage.setItem('hogar_stock', JSON.stringify(inventario));
            try {
                await fetch(URL_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, accion: 'guardar', inventario: inventario }) });
            } catch(e) { console.error("No se pudo sincronizar de fondo."); }
        }

        async function guardarDatosConLoader() {
            localStorage.setItem('hogar_stock', JSON.stringify(inventario));
            renderizar();
            mostrarLoading(true, "Guardando...");
            try {
                await fetch(URL_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, accion: 'guardar', inventario: inventario }) });
            } catch(e) { console.error("No se pudo sincronizar."); } finally { mostrarLoading(false); }
        }

        // --- REGISTRO DE HISTORIAL DE COMPRAS ---
        function enviarAHistorialBackground(nombre, categoria, cantidad, unidad) {
            fetch(URL_APPS_SCRIPT, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify({ token: TOKEN, accion: 'historial', compra: { nombre, categoria, cantidad, unidad } }) 
            }).catch(e => console.error("Error al enviar historial", e));
        }

        // --- MANEJO DE INTERFAZ (UI) ---
        function cambiarTab(tab) {
            document.getElementById('sec-stock').style.display = tab === 'stock' ? 'block' : 'none';
            document.getElementById('sec-lista').style.display = tab === 'lista' ? 'block' : 'none';
            document.getElementById('tab-stock').className = tab === 'stock' ? 'flex-1 py-3 text-center tab-active' : 'flex-1 py-3 text-center tab-inactive bg-gray-50';
            document.getElementById('tab-lista').className = tab === 'lista' ? 'flex-1 py-3 text-center tab-active' : 'flex-1 py-3 text-center tab-inactive bg-gray-50';
        }

        function toggleBuscador() {
            const buscador = document.getElementById('contenedor-buscador');
            buscador.classList.toggle('hidden');
            if (!buscador.classList.contains('hidden')) document.getElementById('input-buscador').focus();
            else { document.getElementById('input-buscador').value = ''; renderizar(); }
        }

        // --- ACCIONES DEL USUARIO ---
        function agregarProductoManual(e) {
            e.preventDefault();
            let nombre = document.getElementById('nombre-stock').value.trim();
            let categoria = document.getElementById('categoria-stock').value;
            let cantidad = parseFloat(document.getElementById('cant-stock').value) || 0;
            let unidad = document.getElementById('unidad-stock').value;
            let minimo = parseFloat(document.getElementById('min-stock').value) || 0;
            let vaAHistorial = document.getElementById('historial-stock').checked;
            
            let existente = buscarProductoSimilar(nombre);

            if (existente) {
                let confirmar = confirm(`🔍 Producto similar detectado: "${existente.nombre}".\n¿Deseas sumar ${cantidad} a este producto?`);
                if (confirmar) {
                    existente.cantidad += cantidad; existente.categoria = categoria; existente.unidad = unidad; existente.minimo = minimo;
                    if(vaAHistorial && cantidad > 0) enviarAHistorialBackground(existente.nombre, categoria, cantidad, unidad);
                } else {
                    inventario.push({ id: Date.now(), nombre, categoria, cantidad, unidad, minimo });
                    if(vaAHistorial && cantidad > 0) enviarAHistorialBackground(nombre, categoria, cantidad, unidad);
                }
            } else {
                inventario.push({ id: Date.now(), nombre, categoria, cantidad, unidad, minimo });
                if(vaAHistorial && cantidad > 0) enviarAHistorialBackground(nombre, categoria, cantidad, unidad);
            }

            document.getElementById('form-add-stock').reset();
            document.getElementById('cant-stock').value = 1;
            document.getElementById('min-stock').value = 1;
            document.getElementById('contenedor-form-stock').classList.add('hidden');
            guardarDatosConLoader();
        }

        function agregarCompraManual(e) {
            e.preventDefault();
            let nombre = document.getElementById('nombre-compra').value.trim();
            let existente = buscarProductoSimilar(nombre);

            if (existente) {
                let confirmar = confirm(`🔍 Producto detectado: "${existente.nombre}".\n¿Deseas pasarlo a faltante (stock 0)?`);
                if (confirmar) existente.cantidad = 0;
                else inventario.push({ id: Date.now(), nombre, categoria: "Otros", cantidad: 0, unidad: "unid", minimo: 1 });
            } else {
                inventario.push({ id: Date.now(), nombre, categoria: "Otros", cantidad: 0, unidad: "unid", minimo: 1 });
            }

            document.getElementById('form-add-compra').reset();
            document.getElementById('contenedor-form-compra').classList.add('hidden');
            guardarDatosConLoader();
        }

        // Modificación Instantánea de Stock (UX sin bloqueos)
        function modificarStockUI(id, monto) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (item) { 
                item.cantidad = Math.max(0, parseFloat((item.cantidad + monto).toFixed(2))); 
                renderizar(); 
                
                // Debouncing: Espera 1.5s desde el último clic para guardar silenciosamente
                clearTimeout(timerSilencioso);
                timerSilencioso = setTimeout(() => { guardarDatosSilencioso(); }, 1500);
            }
        }

        function setStockManual(id) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (!item) return;
            let nuevo = prompt(`Ingrese nueva cantidad exacta para "${item.nombre}":`, item.cantidad);
            if (nuevo !== null && !isNaN(parseFloat(nuevo))) { 
                item.cantidad = Math.max(0, parseFloat(parseFloat(nuevo).toFixed(2))); 
                renderizar(); 
                guardarDatosSilencioso(); 
            }
        }

        function comprarCantidadCustom(id) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (!item) return;
            let cantidadAgregar = prompt(`¿Cuántos ${item.unidad === 'kg' ? 'kilos' : 'unidades'} compraste de "${item.nombre}"?`, "1");
            if (cantidadAgregar === null) return;
            let num = parseFloat(cantidadAgregar);
            if (!isNaN(num) && num > 0) { 
                item.cantidad += num; 
                renderizar(); 
                guardarDatosSilencioso(); 
                // Al ser el botón "Comprar", siempre va al historial
                enviarAHistorialBackground(item.nombre, item.categoria, num, item.unidad);
            }
        }

        // --- FUNCIONES SECUNDARIAS (Edición/Modales) ---
        function abrirModal(id) {
            const item = inventario.find(i => Number(i.id) === Number(id));
            if (!item) return;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-nombre').value = item.nombre;
            document.getElementById('edit-categoria').value = item.categoria || 'Almacén';
            document.getElementById('edit-cantidad').value = item.cantidad;
            document.getElementById('edit-unidad').value = item.unidad || 'unid';
            document.getElementById('edit-minimo').value = item.minimo;
            document.getElementById('modal-editar').classList.remove('hidden');
        }
        function cerrarModal() { document.getElementById('modal-editar').classList.add('hidden'); }
        function guardarEdicion() {
            const id = Number(document.getElementById('edit-id').value);
            const item = inventario.find(i => Number(i.id) === id);
            if (item) {
                item.nombre = document.getElementById('edit-nombre').value;
                item.categoria = document.getElementById('edit-categoria').value;
                item.cantidad = parseFloat(document.getElementById('edit-cantidad').value) || 0;
                item.unidad = document.getElementById('edit-unidad').value;
                item.minimo = parseFloat(document.getElementById('edit-minimo').value) || 0;
                guardarDatosConLoader(); cerrarModal();
            }
        }
        function eliminarDesdeModal() {
            const id = Number(document.getElementById('edit-id').value);
            if (confirm("¿Seguro que quieres borrar este producto por completo?")) {
                inventario = inventario.filter(i => Number(i.id) !== id);
                guardarDatosConLoader(); cerrarModal();
            }
        }

        // --- IA Y PROCESAMIENTO ---
        function abrirModalTexto() { document.getElementById('texto-masivo').value = ''; document.getElementById('modal-texto').classList.remove('hidden'); }
        function cerrarModalTexto() { document.getElementById('modal-texto').classList.add('hidden'); }
        function mostrarLoading(estado, texto = "Procesando...") {
            document.getElementById('loading-text').innerText = texto;
            if (estado) document.getElementById('modal-loading').classList.remove('hidden');
            else document.getElementById('modal-loading').classList.add('hidden');
        }

        function procesarImagenIA(input) {
            const file = input.files[0];
            if (!file) return;
            mostrarLoading(true, "Comprimiendo foto...");
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > 800) { height *= 800 / width; width = 800; } }
                    else { if (height > 800) { width *= 800 / height; height = 800; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const base64Data = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                    llamarGemini('imagen', base64Data);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file); input.value = '';
        }

        function procesarTextoIA() {
            const texto = document.getElementById('texto-masivo').value.trim();
            if (!texto) return alert("Escribe algo primero.");
            cerrarModalTexto(); llamarGemini('texto', texto);
        }

        async function llamarGemini(tipo, contenido) {
            mostrarLoading(true, "IA Analizando (Puede demorar)...");
            try {
                const response = await fetch(URL_APPS_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, accion: tipo === 'imagen' ? 'gemini_imagen' : 'gemini_texto', contenido: contenido }) });
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                let productos = data.resultado;
                if (!Array.isArray(productos)) productos = productos[Object.keys(productos)[0]];
                mostrarPanelVerificacion(productos);
            } catch (error) { alert("Error de IA: " + error.message); } finally { mostrarLoading(false); }
        }

        let itemsTemporales = [];
        function mostrarPanelVerificacion(productos) {
            document.getElementById('toggle-historial-ia').checked = false; // Por defecto apagado (modo conteo)
            itemsTemporales = productos.map((p, index) => ({ id_temp: 'temp_'+index, nombre: p.nombre || 'Desconocido', categoria: p.categoria || 'Otros', cantidad: parseFloat(p.cantidad) || 1, unidad: p.unidad || 'unid', minimo: 1 }));
            dibujarListaVerificacion(); document.getElementById('modal-verificacion').classList.remove('hidden');
        }

        function dibujarListaVerificacion() {
            const container = document.getElementById('lista-verificacion');
            container.innerHTML = '';
            itemsTemporales.forEach((item, index) => {
                container.innerHTML += `
                    <div class="bg-white p-2 border-b flex flex-col gap-2 relative">
                        <button onclick="eliminarItemTemporal(${index})" class="absolute top-2 right-2 text-red-500 bg-red-50 rounded px-2">X</button>
                        <div class="pr-8">
                            <label class="text-[10px] text-gray-400 font-bold uppercase">Producto</label>
                            <input type="text" class="w-full border-b border-gray-300 text-sm py-1 font-semibold text-gray-700 bg-transparent" value="${item.nombre}" onchange="itemsTemporales[${index}].nombre=this.value">
                        </div>
                        <div class="flex gap-2 items-end">
                            <div class="flex-1">
                                <label class="text-[10px] text-gray-400 font-bold uppercase">Cat.</label>
                                <input type="text" class="w-full border-b border-gray-300 text-xs py-1 bg-transparent" value="${item.categoria}" readonly>
                            </div>
                            <div class="w-16">
                                <label class="text-[10px] text-gray-400 font-bold uppercase">Cant.</label>
                                <input type="number" step="any" class="w-full border-b border-gray-300 text-sm py-1 text-center bg-transparent" value="${item.cantidad}" onchange="itemsTemporales[${index}].cantidad=parseFloat(this.value)||0">
                            </div>
                            <div class="w-16">
                                <label class="text-[10px] text-gray-400 font-bold uppercase">U.</label>
                                <input type="text" class="w-full border-b border-gray-300 text-xs py-1 text-center bg-transparent" value="${item.unidad}" readonly>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function eliminarItemTemporal(index) { itemsTemporales.splice(index, 1); dibujarListaVerificacion(); }
        function cerrarModalVerificacion() { itemsTemporales = []; document.getElementById('modal-verificacion').classList.add('hidden'); }
        
        function guardarVerificados() {
            const vaAHistorial = document.getElementById('toggle-historial-ia').checked;
            
            itemsTemporales.forEach(item => {
                if(item.nombre.trim() !== '') {
                    let existente = buscarProductoSimilar(item.nombre);
                    if (existente) {
                        existente.cantidad += item.cantidad; // Fusiona stock
                        if(vaAHistorial && item.cantidad > 0) enviarAHistorialBackground(existente.nombre, existente.categoria, item.cantidad, existente.unidad);
                    } else {
                        inventario.push({ id: Date.now() + Math.random(), nombre: item.nombre, categoria: item.categoria, cantidad: item.cantidad, unidad: item.unidad || 'unid', minimo: 1 });
                        if(vaAHistorial && item.cantidad > 0) enviarAHistorialBackground(item.nombre, item.categoria, item.cantidad, item.unidad);
                    }
                }
            });
            guardarDatosConLoader(); cerrarModalVerificacion(); cambiarTab('stock');
        }

        // --- RENDERIZADO VISUAL ---
        function renderizar() {
            const listaStock = document.getElementById('lista-stock');
            const listaCompras = document.getElementById('lista-compras');
            const termino = document.getElementById('input-buscador') ? document.getElementById('input-buscador').value.toLowerCase() : '';
            
            listaStock.innerHTML = ''; listaCompras.innerHTML = '';
            
            const invFiltrado = inventario.filter(item => { if (termino && !item.nombre.toLowerCase().includes(termino) && !(item.categoria || '').toLowerCase().includes(termino)) return false; return true; });
            const invOrdenado = [...invFiltrado].sort((a, b) => a.nombre.localeCompare(b.nombre));

            invOrdenado.forEach(item => {
                // Matemática estricta de Faltantes y Alertas
                const faltanteTotal = item.cantidad <= item.minimo;
                const alertaAmarilla = item.cantidad > item.minimo && item.cantidad <= (item.minimo + 1);
                
                let borderClass = "border-gray-300";
                let bgClass = "bg-white";
                
                if (faltanteTotal) {
                    borderClass = "border-red-500";
                    bgClass = "bg-red-50"; // Rojo suave
                } else if (alertaAmarilla) {
                    borderClass = "border-yellow-400";
                    bgClass = "bg-yellow-50"; // Amarillo suave
                }

                listaStock.innerHTML += `
                    <div class="flex flex-col border p-3 rounded-lg shadow-sm mb-2 ${borderClass} ${bgClass}">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <p class="font-bold text-gray-800 leading-tight">${item.nombre}</p>
                                <p class="text-xs text-gray-500">${item.categoria || 'Otros'} | Mínimo: ${item.minimo} ${item.unidad}</p>
                            </div>
                            <button onclick="abrirModal(${item.id})" class="text-gray-400 p-1 text-lg">✏️</button>
                        </div>
                        <div class="flex justify-between items-center mt-2 border-t pt-2 border-gray-200 border-opacity-50">
                            <div class="flex-1 cursor-pointer" onclick="setStockManual(${item.id})">
                                <span class="text-sm font-semibold text-gray-700 bg-white px-2 py-1 rounded shadow-sm border border-gray-200">Stock: ${item.cantidad} ${item.unidad}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="modificarStockUI(${item.id}, ${item.unidad === 'kg' ? -0.5 : -1})" class="w-10 h-10 rounded-full bg-gray-200 text-gray-800 font-bold text-lg flex items-center justify-center active:bg-gray-300 transition">-</button>
                                <button onclick="modificarStockUI(${item.id}, ${item.unidad === 'kg' ? 0.5 : 1})" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-lg flex items-center justify-center active:bg-blue-700 shadow-md transition">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Filtro para compras: Solo los estrictamente <= minimo
            const faltantes = invOrdenado.filter(item => item.cantidad <= item.minimo);
            
            if (faltantes.length === 0) {
                listaCompras.innerHTML = '<p class="text-center text-gray-500 mt-6 italic">¡Todo listo! No hay faltantes.</p>';
            } else {
                const categorias = [...new Set(faltantes.map(i => i.categoria || 'Otros'))].sort();
                categorias.forEach(cat => {
                    listaCompras.innerHTML += `<div class="bg-gray-200 text-gray-800 text-xs font-bold uppercase px-3 py-2 rounded shadow-sm mt-4 mb-2 flex items-center gap-1 border-l-4 border-gray-400">📍 Pasillo: ${cat}</div>`;
                    
                    const itemsCat = faltantes.filter(i => (i.categoria || 'Otros') === cat);
                    itemsCat.forEach(item => {
                        const enCero = item.cantidad === 0;
                        let etiqueta = enCero ? '<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded ml-2 shadow-sm">Agotado</span>' : '<span class="bg-yellow-500 text-white text-[10px] font-bold px-2 py-0.5 rounded ml-2 shadow-sm">Faltante</span>';
                        
                        listaCompras.innerHTML += `
                            <div class="flex flex-col border p-3 rounded-lg shadow-sm bg-white mb-2 border-l-4 border-red-500">
                                <div class="flex justify-between items-center mb-2">
                                    <p class="font-bold text-gray-800 text-sm leading-tight flex-1">${item.nombre} ${etiqueta}</p>
                                </div>
                                <div class="flex justify-between items-center bg-gray-50 p-1.5 rounded">
                                    <p class="text-xs text-gray-600 font-semibold">Tenés: ${item.cantidad} ${item.unidad} <span class="text-gray-400 font-normal">(Min: ${item.minimo})</span></p>
                                    <button onclick="comprarCantidadCustom(${item.id})" class="bg-green-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-md flex items-center gap-1 active:bg-green-600 transition">🛒 Comprar</button>
                                </div>
                            </div>
                        `;
                    });
                });
            }
        }
        
        window.onload = cargarDesdeNube;
    </script>
</body>
</html>
