    <!-- SCRIPT PRINCIPAL COMPACTADO -->
    <script>
        let inventario = []; let timerSilencioso = null;

        function limpiarNombre(t) { if(!t) return ''; let l=t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); ['lata de ','frasco de ','bolsa de ','paquete de ','caja de ','botella de ','kg de '].forEach(p=>{l=l.replace(p,'');}); return l.replace(/\s+/g,' ').trim(); }
        function edDist(s1,s2) { let c=new Array(); for(let i=0;i<=s1.length;i++){ let l=i; for(let j=0;j<=s2.length;j++){ if(i==0)c[j]=j; else if(j>0){ let nv=c[j-1]; if(s1.charAt(i-1)!=s2.charAt(j-1)) nv=Math.min(Math.min(nv,l),c[j])+1; c[j-1]=l; l=nv; } } if(s1.length>0)c[s2.length]=l; } return c[s2.length]; }
        function calSim(s1,s2) { let lng=s1; let sh=s2; if(s1.length<s2.length){lng=s2;sh=s1;} if(lng.length===0)return 1.0; return (lng.length-edDist(lng,sh))/parseFloat(lng.length); }
        function buscarProductoSimilar(n) { let nl=limpiarNombre(n); if(!nl)return null; let mc=null; let ms=0; for(let i of inventario){ let il=limpiarNombre(i.nombre); if(il===nl||il.includes(nl)||nl.includes(il))return i; let s=calSim(il,nl); if(s>ms){ms=s;mc=i;} } return ms>=0.75?mc:null; }

        async function cargarDesdeNube() {
            mostrarLoading(true, "Descargando inventario...");
            try {
                const res = await fetch(URL_APPS_SCRIPT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token:TOKEN, accion:'leer'}) });
                const d = await res.json();
                if(d.inventario) {
                    inventario = d.inventario.map(i => {
                        let u = String(i.unidad||'').toLowerCase().trim(); let m = parseFloat(i.minimo);
                        if(!isNaN(u)&&u!==''){m=parseFloat(u);u='unid';} else if(!['unid','kg','gs','g'].includes(u)) u='unid'; if(isNaN(m)) m=0;
                        return { id:Number(i.id)||Date.now()+Math.random(), nombre:i.nombre||'', categoria:i.categoria||'Otros', cantidad:parseFloat(i.cantidad)||0, unidad:u, minimo:m, forzarCompra:!!i.forzarCompra };
                    }); renderizar();
                } else if(d.error) throw new Error(d.error);
            } catch(e) { console.error(e); inventario = JSON.parse(localStorage.getItem('hogar_stock'))||[]; renderizar(); } 
            finally { mostrarLoading(false); }

        function agregarProductoManual(e, tForm) {
            e.preventDefault();
            let n = document.getElementById(tForm==='stock'?'nombre-stock':'nombre-compra').value.trim();
            let c = document.getElementById(tForm==='stock'?'categoria-stock':'categoria-compra').value;
            let q = parseFloat(document.getElementById(tForm==='stock'?'cant-stock':'cant-compra').value)||0;
            let u = document.getElementById(tForm==='stock'?'unidad-stock':'unidad-compra').value;
            let m = parseFloat(document.getElementById(tForm==='stock'?'min-stock':'min-compra').value)||0;
            let h = tForm==='stock'?document.getElementById('historial-stock').checked:false;
            
            let ex = buscarProductoSimilar(n);
            if(ex) {
                let conf = confirm(`Producto detectado: "${ex.nombre}".\n¿Deseas ${tForm==='stock'?`sumar ${q} a este producto`:`pasarlo a faltante (stock 0)`}?`);
                if(conf) {
                    if(tForm==='stock'){ ex.cantidad+=q; ex.categoria=c; ex.unidad=u; ex.minimo=m; if(h&&q>0)enviarAHistorialBackground(ex.nombre,c,q,u); }
                    else { ex.cantidad=0; ex.categoria=c; ex.unidad=u; ex.minimo=m; }
                } else { inventario.push({id:Date.now(),nombre:n,categoria:c,cantidad:q,unidad:u,minimo:m,forzarCompra:false}); if(h&&q>0)enviarAHistorialBackground(n,c,q,u); }
            } else { inventario.push({id:Date.now(),nombre:n,categoria:c,cantidad:q,unidad:u,minimo:m,forzarCompra:false}); if(h&&q>0)enviarAHistorialBackground(n,c,q,u); }
            
            document.getElementById(`form-add-${tForm}`).reset();
            if(tForm==='stock'){document.getElementById('cant-stock').value=1;document.getElementById('min-stock').value=1;document.getElementById('contenedor-form-stock').classList.add('hidden');}
            else{document.getElementById('cant-compra').value=0;document.getElementById('min-compra').value=1;document.getElementById('contenedor-form-compra').classList.add('hidden');}
            guardarDatosConLoader();
        }

        function setStockManual(id) { let i=inventario.find(i=>Number(i.id)===Number(id)); if(!i)return; let nv=prompt(`Nueva cantidad para "${i.nombre}":`,i.cantidad); if(nv!==null&&!isNaN(parseFloat(nv))){ i.cantidad=Math.max(0,parseFloat(parseFloat(nv).toFixed(2))); renderizar(); guardarDatosSilencioso(); } }
        function comprarCantidadCustom(id) { let i=inventario.find(i=>Number(i.id)===Number(id)); if(!i)return; let nu=i.unidad==='kg'?'kilos':(i.unidad==='gs'||i.unidad==='g'?'gramos':'unidades'); let q=prompt(`¿Cuántos ${nu} compraste de "${i.nombre}"?`,"1"); if(q===null)return; let n=parseFloat(q); if(!isNaN(n)&&n>0){ i.cantidad+=n; i.forzarCompra=false; renderizar(); guardarDatosSilencioso(); enviarAHistorialBackground(i.nombre,i.categoria,n,i.unidad); } }

        function cerrarModal() { document.getElementById('modal-editar').classList.add('hidden'); }
        function guardarEdicion() { let i=inventario.find(i=>Number(i.id)===Number(document.getElementById('edit-id').value)); if(i){ i.nombre=document.getElementById('edit-nombre').value; i.categoria=document.getElementById('edit-categoria').value; i.cantidad=parseFloat(document.getElementById('edit-cantidad').value)||0; i.unidad=document.getElementById('edit-unidad').value; i.minimo=parseFloat(document.getElementById('edit-minimo').value)||0; i.forzarCompra=document.getElementById('edit-forzar-compra').checked; guardarDatosConLoader(); cerrarModal(); } }
        function eliminarDesdeModal() { let id=Number(document.getElementById('edit-id').value); if(confirm("¿Borrar producto por completo?")){ inventario=inventario.filter(i=>Number(i.id)!==id); guardarDatosConLoader(); cerrarModal(); } }

        function abrirModalTexto() { document.getElementById('texto-masivo').value=''; document.getElementById('modal-texto').classList.remove('hidden'); }
        function cerrarModalTexto() { document.getElementById('modal-texto').classList.add('hidden'); }
        function mostrarLoading(e, t="Procesando...") { document.getElementById('loading-text').innerText=t; if(e)document.getElementById('modal-loading').classList.remove('hidden'); else document.getElementById('modal-loading').classList.add('hidden'); }
        function procesarImagenIA(inp) { let f=inp.files[0]; if(!f)return; mostrarLoading(true,"Comprimiendo..."); let r=new FileReader(); r.onload=function(e){ let i=new Image(); i.onload=function(){ let c=document.createElement('canvas'); let w=i.width; let h=i.height; if(w>h){if(w>800){h*=800/w;w=800;}}else{if(h>800){w*=800/h;h=800;}} c.width=w; c.height=h; c.getContext('2d').drawImage(i,0,0,w,h); llamarGemini('imagen',c.toDataURL('image/jpeg',0.7).split(',')[1]); }; i.src=e.target.result; }; r.readAsDataURL(f); inp.value=''; }
        function procesarTextoIA() { let t=document.getElementById('texto-masivo').value.trim(); if(!t)return alert("Escribe algo."); cerrarModalTexto(); llamarGemini('texto',t); }

        async function llamarGemini(tipo, cont) {
            mostrarLoading(true, "IA Analizando...");
            try {
                let res=await fetch(URL_APPS_SCRIPT, {method:'POST', body:JSON.stringify({token:TOKEN, accion:tipo==='imagen'?'gemini_imagen':'gemini_texto', contenido:cont})});
                let d=await res.json(); if(d.error)throw new Error(d.error);
                let p=d.resultado; if(!Array.isArray(p)) p=p[Object.keys(p)[0]];
                document.getElementById('toggle-historial-ia').checked=false; itemsTemporales=p.map((x,idx)=>({id_temp:'temp_'+idx, nombre:x.nombre||'Desc', categoria:x.categoria||'Otros', cantidad:parseFloat(x.cantidad)||1, unidad:x.unidad||'unid', minimo:1}));
                dibujarListaVerificacion(); document.getElementById('modal-verificacion').classList.remove('hidden');
            } catch(e) { alert("Error IA: "+e.message); } finally { mostrarLoading(false); }
        }

        let itemsTemporales = [];
        function dibujarListaVerificacion() {
            let c=document.getElementById('lista-verificacion'); c.innerHTML='';
            itemsTemporales.forEach((i, idx)=>{
                let ex=buscarProductoSimilar(i.nombre);
                let cDup=ex?`<label class="flex items-center gap-2 bg-blue-50 text-blue-900 text-xs font-bold px-2.5 py-2 rounded-lg shadow-sm cursor-pointer mt-2 border border-blue-200 transition active:bg-blue-100"><input type="checkbox" checked onchange="itemsTemporales[${idx}].forzarNuevo=!this.checked" class="w-4 h-4 text-blue-600 rounded">🔄 Fusionar con: "${ex.nombre}"</label>`:`<span class="bg-green-50 text-green-800 text-xs font-bold px-2.5 py-2 rounded-lg shadow-sm mt-2 inline-block border border-green-200">✨ Producto Nuevo</span>`;
                let opCat=Object.keys(iconosCat).map(cat=>`<option value="${cat}" ${i.categoria===cat?'selected':''}>${cat}</option>`).join('');
                c.innerHTML+=`
                    <div class="bg-white p-3 border border-gray-100 rounded-xl flex flex-col gap-1 relative pb-3 shadow-sm mb-2">
                        <button onclick="eliminarItemTemporal(${idx})" class="absolute top-2 right-2 text-red-500 bg-red-50 rounded-lg w-7 h-7 flex items-center justify-center font-bold hover:bg-red-100">X</button>
                        <div class="pr-8"><label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Producto</label><input type="text" class="w-full border-b border-gray-200 text-sm py-1 font-bold text-gray-900 bg-transparent focus:border-blue-500 focus:outline-none" value="${i.nombre}" onchange="itemsTemporales[${idx}].nombre=this.value">${cDup}</div>
                        <div class="flex gap-2 items-end mt-2">
                            <div class="flex-1"><label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Cat.</label><select class="w-full border-b border-gray-300 text-xs py-1.5 bg-gray-50 rounded text-gray-700 font-bold focus:border-blue-500 focus:outline-none px-1" onchange="itemsTemporales[${idx}].categoria=this.value">${opCat}</select></div>
                            <div class="w-14"><label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Cant.</label><input type="number" step="any" class="w-full border-b border-gray-400 text-sm py-1 text-center bg-gray-50 rounded font-black text-blue-600 focus:border-blue-500 focus:outline-none" value="${i.cantidad}" onchange="itemsTemporales[${idx}].cantidad=parseFloat(this.value)||0"></div>
                            <div class="w-16"><label class="text-[10px] text-gray-400 font-bold uppercase ml-1">U.</label><select class="w-full border-b border-gray-300 text-xs py-1.5 text-center bg-gray-50 rounded text-gray-700 font-bold focus:border-blue-500 focus:outline-none px-1" onchange="itemsTemporales[${idx}].unidad=this.value"><option value="unid" ${i.unidad==='unid'||!['kg','gs','g'].includes(i.unidad)?'selected':''}>unid</option><option value="kg" ${i.unidad==='kg'?'selected':''}>kg</option><option value="gs" ${(i.unidad==='gs'||i.unidad==='g')?'selected':''}>gs</option></select></div>
                            <div class="w-12"><label class="text-[10px] text-gray-400 font-bold uppercase ml-1">Mín.</label><input type="number" step="any" class="w-full border-b border-gray-300 text-sm py-1 text-center bg-gray-50 rounded text-gray-700 font-bold focus:border-blue-500 focus:outline-none" value="${i.minimo}" onchange="itemsTemporales[${idx}].minimo=parseFloat(this.value)||0"></div>
                        </div>
                    </div>`;
            });
        }
        function eliminarItemTemporal(idx) { itemsTemporales.splice(idx,1); dibujarListaVerificacion(); }
        function cerrarModalVerificacion() { itemsTemporales=[]; document.getElementById('modal-verificacion').classList.add('hidden'); }
        function guardarVerificados() {
            let h=document.getElementById('toggle-historial-ia').checked;
            itemsTemporales.forEach(i=>{
                if(i.nombre.trim()!==''){
                    let ex=i.forzarNuevo?null:buscarProductoSimilar(i.nombre);
                    if(ex){ ex.cantidad+=i.cantidad; if(h&&i.cantidad>0)enviarAHistorialBackground(ex.nombre,ex.categoria,i.cantidad,ex.unidad); }
                    else{ inventario.push({id:Date.now()+Math.random(),nombre:i.nombre,categoria:i.categoria,cantidad:i.cantidad,unidad:i.unidad||'unid',minimo:i.minimo,forzarCompra:false}); if(h&&i.cantidad>0)enviarAHistorialBackground(i.nombre,i.categoria,i.cantidad,i.unidad); }
                }
            });
            guardarDatosConLoader(); cerrarModalVerificacion(); cambiarTab('stock');
        }

        // =====================================
        // MOTOR DE RENDERIZADO ACUMULATIVO
        // =====================================
        function renderizar() {
            const ls = document.getElementById('lista-stock'); const lc = document.getElementById('lista-compras');
            const termino = (document.getElementById('input-buscador')?document.getElementById('input-buscador').value.toLowerCase():'').trim();
            ls.innerHTML=''; lc.innerHTML='';
            
            let cStockOk=0, cStockAlerta=0, cStockAgotado=0;
            let cCompraAlerta=0, cCompraAgotado=0, cCompraManual=0;
            
            let invBuscado = inventario.filter(i => { if(termino&&!i.nombre.toLowerCase().includes(termino)&&!(i.categoria||'').toLowerCase().includes(termino)) return false; return true; });
            const invOrd = [...invBuscado].sort((a,b)=>a.nombre.localeCompare(b.nombre));

            // Clases UI Filtros Stock
            document.getElementById('btn-stock-suficiente').className = filtrosStock.suficiente ? "cursor-pointer bg-green-50 rounded-xl p-2 shadow-sm border-2 border-green-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";
            document.getElementById('btn-stock-alerta').className = filtrosStock.alerta ? "cursor-pointer bg-yellow-50 rounded-xl p-2 shadow-sm border-2 border-yellow-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";
            document.getElementById('btn-stock-agotado').className = filtrosStock.agotado ? "cursor-pointer bg-red-50 rounded-xl p-2 shadow-sm border-2 border-red-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";

            // Clases UI Filtros Compras
            document.getElementById('btn-compra-alerta').className = filtrosCompras.alerta ? "cursor-pointer bg-yellow-50 rounded-xl p-2 shadow-sm border-2 border-yellow-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";
            document.getElementById('btn-compra-agotado').className = filtrosCompras.agotado ? "cursor-pointer bg-red-50 rounded-xl p-2 shadow-sm border-2 border-red-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";
            document.getElementById('btn-compra-manual').className = filtrosCompras.manual ? "cursor-pointer bg-blue-50 rounded-xl p-2 shadow-sm border-2 border-blue-400 flex flex-col items-center justify-center transition-all transform scale-105" : "cursor-pointer bg-white rounded-xl p-2 shadow-sm border border-gray-100 flex flex-col items-center justify-center transition-all hover:bg-gray-50";

            const categoriasUnicas = [...new Set(invOrd.map(i=>i.categoria||'Otros'))].sort();

            // PESTAÑA 1: STOCK
            const fStockOn = filtrosStock.suficiente||filtrosStock.alerta||filtrosStock.agotado;
            categoriasUnicas.forEach(cat => {
                let itemsTotalesCat = invOrd.filter(i=>(i.categoria||'Otros')===cat);
                itemsTotalesCat.forEach(i=>{ if(i.cantidad<=i.minimo)cStockAgotado++; else if(i.cantidad>i.minimo&&i.cantidad<=(i.minimo+1))cStockAlerta++; else cStockOk++; });

                let itemsAMostrar = itemsTotalesCat;
                if(fStockOn) {
                    itemsAMostrar = itemsAMostrar.filter(i=>{
                        if(filtrosStock.suficiente && i.cantidad>(i.minimo+1)) return true;
                        if(filtrosStock.alerta && i.cantidad>i.minimo && i.cantidad<=(i.minimo+1)) return true;
                        if(filtrosStock.agotado && i.cantidad<=i.minimo) return true;
                        return false;
                    });
                }

                if(itemsAMostrar.length===0) return;
                
                const isOpen = !!estadoCategoriasStock[cat] || termino!=='' || fStockOn;
                ls.innerHTML += `<div onclick="toggleCategoria('${cat}','stock')" class="font-extrabold text-gray-700 mt-5 mb-2 flex items-center justify-between text-[15px] border-b-2 border-gray-200 pb-1.5 cursor-pointer select-none active:text-blue-600 transition px-1"><div class="flex items-center gap-2">${iconosCat[cat]||"📦"} ${cat}</div><span class="text-xs text-gray-400">${isOpen?'▼':'▶'}</span></div>`;

                if(isOpen) {
                    itemsAMostrar.forEach(item=>{
                        const f = item.cantidad<=item.minimo; const a = item.cantidad>item.minimo&&item.cantidad<=(item.minimo+1);
                        let bSide="bg-gray-300"; let bgC="bg-white"; if(f){bSide="bg-red-500";bgC="bg-red-50";}else if(a){bSide="bg-yellow-400";bgC="bg-yellow-50";}
                        let sUp = item.unidad==='kg'?0.5:(item.unidad==='gs'||item.unidad==='g'?100:1); let sDw = item.unidad==='kg'?-0.5:(item.unidad==='gs'||item.unidad==='g'?-100:-1);
                        ls.innerHTML += `
                            <div class="flex flex-col p-3.5 rounded-xl shadow-sm mb-3 border border-gray-100 relative overflow-hidden ${bgC}">
                                <div class="absolute left-0 top-0 bottom-0 w-1.5 ${bSide}"></div>
                                <div class="pl-2">
                                    <div class="flex justify-between items-start mb-2"><div class="flex-1 pr-2"><p class="font-bold text-gray-900 leading-tight text-base">${item.nombre}</p><p class="text-xs text-gray-500 mt-0.5 font-semibold">Mínimo: ${item.minimo} ${item.unidad}</p></div><button onclick="abrirModal(${item.id})" class="text-gray-400 p-1 text-xl hover:text-blue-500 transition">⋮</button></div>
                                    <div class="flex justify-end mt-1"><div class="flex items-center bg-white rounded-full border border-gray-200 shadow-sm p-1"><button onclick="modificarStockUI(${item.id}, ${sDw})" class="w-10 h-10 rounded-full text-gray-600 font-bold text-xl flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 transition pb-1">-</button><div class="px-3 cursor-pointer min-w-[5rem] text-center" onclick="setStockManual(${item.id})"><span class="text-base font-black text-gray-800">${item.cantidad}</span><span class="text-xs font-bold text-gray-500 block -mt-1">${item.unidad}</span></div><button onclick="modificarStockUI(${item.id}, ${sUp})" class="w-10 h-10 rounded-full bg-blue-600 text-white font-bold text-xl flex items-center justify-center hover:bg-blue-700 active:bg-blue-800 shadow-md transition pb-1">+</button></div></div>
                                </div>
                            </div>`;
                    });
                }
            });
            document.getElementById('dash-stock-ok').innerText = cStockOk; document.getElementById('dash-stock-alerta').innerText = cStockAlerta; document.getElementById('dash-stock-agotado').innerText = cStockAgotado;

            // PESTAÑA 2: COMPRAS
            let itemsParaComprar = invOrd.filter(i=>i.cantidad<=(i.minimo+1)||i.forzarCompra);
            const fCompOn = filtrosCompras.alerta||filtrosCompras.agotado||filtrosCompras.manual;

            itemsParaComprar.forEach(i=>{ if(i.cantidad<=i.minimo)cCompraAgotado++; else if(i.cantidad>i.minimo&&i.cantidad<=(i.minimo+1))cCompraAlerta++; if(i.forzarCompra)cCompraManual++; });
            document.getElementById('dash-compra-alerta').innerText = cCompraAlerta; document.getElementById('dash-compra-agotado').innerText = cCompraAgotado; document.getElementById('dash-compra-manual').innerText = cCompraManual;

            if(fCompOn) {
                itemsParaComprar = itemsParaComprar.filter(i=>{
                    if(filtrosCompras.agotado && i.cantidad<=i.minimo) return true;
                    if(filtrosCompras.alerta && i.cantidad>i.minimo && i.cantidad<=(i.minimo+1)) return true;
                    if(filtrosCompras.manual && i.forzarCompra) return true;
                    return false;
                });
            }

            if(itemsParaComprar.length===0){
                lc.innerHTML = '<div class="text-center mt-10"><p class="text-4xl mb-3">🎉</p><p class="text-gray-500 font-bold">No hay faltantes o no coinciden con tu filtro.</p></div>';
            } else {
                const catComp = [...new Set(itemsParaComprar.map(i=>i.categoria||'Otros'))].sort();
                catComp.forEach(cat=>{
                    const iCat = itemsParaComprar.filter(i=>(i.categoria||'Otros')===cat);
                    const isOpComp = !!estadoCategoriasCompras[cat] || termino!=='' || fCompOn;
                    
                    lc.innerHTML += `<div onclick="toggleCategoria('${cat}','compra')" class="font-extrabold text-gray-700 mt-5 mb-2 flex items-center justify-between text-[15px] border-b-2 border-gray-200 pb-1.5 cursor-pointer select-none active:text-blue-600 transition px-1"><div class="flex items-center gap-2">${iconosCat[cat]||"🛒"} ${cat}</div><span class="text-xs text-gray-400">${isOpComp?'▼':'▶'}</span></div>`;
                    
                    if(isOpComp) {
                        iCat.forEach(item=>{
                            let bSide="bg-red-500"; let bgC="bg-red-50"; let bCol="border-red-200";
                            let etiq = item.cantidad===0?'<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase">Agotado</span>':'<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase">Faltante</span>';
                            
                            if(item.cantidad>item.minimo && item.cantidad<=(item.minimo+1)) { bSide="bg-yellow-400"; bgC="bg-yellow-50"; bCol="border-yellow-200"; etiq='<span class="bg-yellow-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase">Alerta</span>'; }
                            if(item.forzarCompra){
                                etiq+='<span class="bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase">Pedido</span>';
                                if(item.cantidad>(item.minimo+1)){ bSide="bg-blue-400"; bgC="bg-blue-50"; bCol="border-blue-200"; etiq='<span class="bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md ml-2 shadow-sm uppercase">Pedido Manual</span>'; }
                            }
                            
                            lc.innerHTML += `
                                <div class="flex flex-col border ${bCol} p-3.5 rounded-xl shadow-sm ${bgC} mb-3 relative overflow-hidden">
                                    <div class="absolute left-0 top-0 bottom-0 w-1.5 ${bSide}"></div>
                                    <div class="pl-2">
                                        <div class="flex justify-between items-center mb-3"><p class="font-bold text-gray-900 text-base leading-tight flex-1">${item.nombre} <br class="block mt-1">${etiq}</p></div>
                                        <div class="flex justify-between items-center bg-white p-2 rounded-lg border border-gray-200 shadow-sm">
                                            <div><p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-0.5">En Casa</p><p class="text-sm font-black text-gray-800">${item.cantidad} ${item.unidad} <span class="text-gray-400 font-semibold text-xs ml-1">(Mín: ${item.minimo})</span></p></div>
                                            <button onclick="comprarCantidadCustom(${item.id})" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md flex items-center gap-1 active:bg-green-700 transition">🛒 Comprar</button>
                                        </div>
                                    </div>
                                </div>`;
                        });
                    }
                });
            }
        }
        window.onload = cargarDesdeNube;
    </script>
</body>
</html>
